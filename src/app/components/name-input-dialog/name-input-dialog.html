<h1 mat-dialog-title>What is your name?</h1>
<form (ngSubmit)="close()">
  <mat-dialog-content>
    <mat-form-field>
      <mat-label>Player name</mat-label>
      <input matInput [ngModel]="name()" (ngModelChange)="name.set($event)" name="playerName"/>
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button mat-flat-button type="button" mat-dialog-close>Cancel</button>
    <button mat-flat-button type="submit" color="primary" cdkFocusInitial>Use this name
    </button>
  </mat-dialog-actions>
</form>
